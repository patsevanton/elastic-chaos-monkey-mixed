fullnameOverride: elasticsearch-exporter

replicaCount: 3

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: DoNotSchedule
    labelSelector:
      matchLabels:
        app.kubernetes.io/name: prometheus-elasticsearch-exporter
        app.kubernetes.io/instance: elasticsearch-exporter

serviceAccount:
  create: true
  name: elasticsearch-exporter

es:
  uri: http://elastic-es-http.elastic.svc:9200
  all: true
  indices: true
  cluster_settings: true

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

serviceMonitor:
  enabled: true
  interval: 20s
