#cloud-config
package_update: true
packages:
  - python3
  - python3-pip
  - python3-venv
  - jq
  - curl
  - pbzip2
  - git
write_files:
  - path: /home/ubuntu/.rally/rally.ini
    owner: ubuntu:ubuntu
    permissions: "0644"
    defer: true
    content: |
      [meta]
      config.version = 17

      [system]
      env.name = local

      [node]
      root.dir = ${CONFIG_DIR}/benchmarks
      src.root.dir = ${CONFIG_DIR}/benchmarks/src

      [source]
      remote.repo.url = https://github.com/elastic/elasticsearch.git
      elasticsearch.src.subdir = elasticsearch

      [benchmarks]
      local.dataset.cache = ${CONFIG_DIR}/benchmarks/data

      [reporting]
      datastore.type = in-memory
      datastore.host =
      datastore.port =
      datastore.secure = False
      datastore.user =
      datastore.password =

      [tracks]
      default.url =

      [teams]
      default.url = https://github.com/elastic/rally-teams

      [defaults]
      preserve_benchmark_candidate = false

      [distributions]
      release.cache = true
  - path: /usr/local/bin/fetch-rally-corpora.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      BASE=https://storage.yandexcloud.net/download-resources-for-apatsev
      DATA=/home/ubuntu/.rally/benchmarks/data
      TRIES=5
      ok() {
        dest=$1
        size=$2
        sha=$3
        [ -f "$dest" ] || return 1
        [ "$(stat -c%s "$dest")" = "$size" ] || return 1
        [ "$(sha256sum "$dest" | awk '{print $1}')" = "$sha" ]
      }
      fetch() {
        url=$1
        dest=$2
        size=$3
        sha=$4
        i=1
        while [ "$i" -le "$TRIES" ]; do
          ok "$dest" "$size" "$sha" && return 0
          rm -f "$dest"
          if curl -fL --retry 5 --retry-delay 5 -o "$dest" "$url" && ok "$dest" "$size" "$sha"; then
            return 0
          fi
          echo "retry $i: $dest want=$size $sha" >&2
          rm -f "$dest"
          i=$((i + 1))
        done
        echo "failed $dest" >&2
        return 1
      }
      mkdir -p "$DATA/linestrings"
      fetch "$BASE/linestrings.json.bz2" "$DATA/linestrings/linestrings.json.bz2" 3698508764 12c02f175e1f74bd09f5ea73ef74f289883628f374c523e3422163d9469516ed || exit 1
      # osmpolygons: корпус скачивается, ingest в challenge закомментирован
      # i=1
      # while [ "$i" -le "$TRIES" ]; do
      #   if fetch "$BASE/polygons.json.bz2.00" "$DATA/polygons/polygons.json.bz2.00" 4418558680 4839955f5426edda2d3fae67ae42e34b9fa059ddb43de0de1cbad0b9f2a7dbad \
      #     && fetch "$BASE/polygons.json.bz2.01" "$DATA/polygons/polygons.json.bz2.01" 4418558679 4b9f0204323705b5ead5c19b922c3b700cb1a777a7e51c585ff5dc5996f65bf3; then
      #     cat "$DATA/polygons/polygons.json.bz2.00" "$DATA/polygons/polygons.json.bz2.01" > "$DATA/polygons/polygons.json.bz2"
      #     if ok "$DATA/polygons/polygons.json.bz2" 8837117359 e0526bb7b5c71ae7cc150205f25013e4311321dc986a306f56ff6c8e68e4a910; then
      #       rm -f "$DATA/polygons/polygons.json.bz2.00" "$DATA/polygons/polygons.json.bz2.01"
      #       exit 0
      #     fi
      #     echo "retry $i: polygons.json.bz2 size or sha256 mismatch" >&2
      #   fi
      #   rm -f "$DATA/polygons/polygons.json.bz2" "$DATA/polygons/polygons.json.bz2.00" "$DATA/polygons/polygons.json.bz2.01"
      #   i=$((i + 1))
      # done
      # echo "failed $DATA/polygons/polygons.json.bz2" >&2
      # exit 1
runcmd:
  - mkdir -p /home/ubuntu/id-log /home/ubuntu/.rally/benchmarks/tracks
  - /usr/local/bin/fetch-rally-corpora.sh
  - curl -fL --retry 5 --retry-delay 5 -o /tmp/rally-tracks-e251f6ca.tar.gz https://storage.yandexcloud.net/download-resources-for-apatsev/rally-tracks-e251f6ca.tar.gz
  - tar -xzf /tmp/rally-tracks-e251f6ca.tar.gz -C /tmp
  - rm -rf /home/ubuntu/.rally/benchmarks/tracks/default
  - mv /tmp/rally-tracks /home/ubuntu/.rally/benchmarks/tracks/default
  - rm -f /tmp/rally-tracks-e251f6ca.tar.gz
  - chown -R ubuntu:ubuntu /home/ubuntu
  - sudo -u ubuntu git -C /home/ubuntu/.rally/benchmarks/tracks/default remote remove origin
  - sudo -u ubuntu python3 -m venv /home/ubuntu/venv
  - sudo -u ubuntu /home/ubuntu/venv/bin/pip install --upgrade pip esrally
  - sudo -u ubuntu sh -c 'echo '\''export PATH="$HOME/venv/bin:$PATH"'\'' >> /home/ubuntu/.bashrc'
