#cloud-config
package_update: true
packages:
  - python3
  - python3-pip
  - python3-venv
  - jq
  - curl
  - pbzip2
  - git
write_files:
  - path: /home/ubuntu/.rally/rally.ini
    owner: ubuntu:ubuntu
    permissions: "0644"
    defer: true
    content: |
      [meta]
      config.version = 17

      [system]
      env.name = local

      [node]
      root.dir = ${CONFIG_DIR}/benchmarks
      src.root.dir = ${CONFIG_DIR}/benchmarks/src

      [source]
      remote.repo.url = https://github.com/elastic/elasticsearch.git
      elasticsearch.src.subdir = elasticsearch

      [benchmarks]
      local.dataset.cache = ${CONFIG_DIR}/benchmarks/data

      [reporting]
      datastore.type = in-memory
      datastore.host =
      datastore.port =
      datastore.secure = False
      datastore.user =
      datastore.password =

      [tracks]
      default.url =

      [teams]
      default.url = https://github.com/elastic/rally-teams

      [defaults]
      preserve_benchmark_candidate = false

      [distributions]
      release.cache = true
runcmd:
  - mkdir -p /home/ubuntu/id-log /home/ubuntu/.rally/benchmarks/data/linestrings /home/ubuntu/.rally/benchmarks/data/multilinestrings /home/ubuntu/.rally/benchmarks/data/polygons /home/ubuntu/.rally/benchmarks/tracks
  - curl -fL --retry 5 --retry-delay 5 -o /home/ubuntu/.rally/benchmarks/data/linestrings/linestrings.json.bz2 https://storage.yandexcloud.net/download-resources-for-apatsev/linestrings.json.bz2
  - curl -fL --retry 5 --retry-delay 5 -o /home/ubuntu/.rally/benchmarks/data/multilinestrings/multilinestrings.json.bz2 https://storage.yandexcloud.net/download-resources-for-apatsev/multilinestrings.json.bz2
  - curl -fL --retry 5 --retry-delay 5 -o /home/ubuntu/.rally/benchmarks/data/polygons/polygons.json.bz2.00 https://storage.yandexcloud.net/download-resources-for-apatsev/polygons.json.bz2.00
  - curl -fL --retry 5 --retry-delay 5 -o /home/ubuntu/.rally/benchmarks/data/polygons/polygons.json.bz2.01 https://storage.yandexcloud.net/download-resources-for-apatsev/polygons.json.bz2.01
  - cat /home/ubuntu/.rally/benchmarks/data/polygons/polygons.json.bz2.00 /home/ubuntu/.rally/benchmarks/data/polygons/polygons.json.bz2.01 > /home/ubuntu/.rally/benchmarks/data/polygons/polygons.json.bz2
  - rm -f /home/ubuntu/.rally/benchmarks/data/polygons/polygons.json.bz2.00 /home/ubuntu/.rally/benchmarks/data/polygons/polygons.json.bz2.01
  - curl -fL --retry 5 --retry-delay 5 -o /tmp/rally-tracks-e251f6ca.tar.gz https://storage.yandexcloud.net/download-resources-for-apatsev/rally-tracks-e251f6ca.tar.gz
  - tar -xzf /tmp/rally-tracks-e251f6ca.tar.gz -C /tmp
  - rm -rf /home/ubuntu/.rally/benchmarks/tracks/default
  - mv /tmp/rally-tracks /home/ubuntu/.rally/benchmarks/tracks/default
  - rm -f /tmp/rally-tracks-e251f6ca.tar.gz
  - chown -R ubuntu:ubuntu /home/ubuntu
  - sudo -u ubuntu git -C /home/ubuntu/.rally/benchmarks/tracks/default remote remove origin
  - sudo -u ubuntu python3 -m venv /home/ubuntu/venv
  - sudo -u ubuntu /home/ubuntu/venv/bin/pip install --upgrade pip esrally
  - sudo -u ubuntu sh -c 'echo '\''export PATH="$HOME/venv/bin:$PATH"'\'' >> /home/ubuntu/.bashrc'
