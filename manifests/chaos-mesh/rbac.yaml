apiVersion: v1
kind: ServiceAccount
metadata:
  name: chaos-mesh-admin
  namespace: vmks
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chaos-mesh-admin
rules:
  - apiGroups: [""]
    resources: ["pods", "namespaces"]
    verbs: ["get", "watch", "list"]
  - apiGroups: ["chaos-mesh.org"]
    resources: ["*"]
    verbs: ["get", "list", "watch", "create", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: chaos-mesh-admin
subjects:
  - kind: ServiceAccount
    name: chaos-mesh-admin
    namespace: vmks
roleRef:
  kind: ClusterRole
  name: chaos-mesh-admin
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: Secret
metadata:
  name: chaos-mesh-admin-token
  namespace: vmks
  annotations:
    kubernetes.io/service-account.name: chaos-mesh-admin
type: kubernetes.io/service-account-token
