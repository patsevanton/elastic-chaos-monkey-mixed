apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: es-network-delay
  namespace: elastic
spec:
  action: delay
  mode: all
  duration: 10m
  direction: both
  selector:
    namespaces:
      - elastic
    labelSelectors:
      elasticsearch.k8s.elastic.co/cluster-name: elastic
    nodeSelectors:
      topology.kubernetes.io/zone: ${ZONE}
  delay:
    latency: 500ms
    correlation: "0"
    jitter: 0ms
