apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: es-network-loss
  namespace: elastic
spec:
  action: loss
  mode: all
  duration: 10m
  direction: both
  selector:
    namespaces:
      - elastic
    labelSelectors:
      elasticsearch.k8s.elastic.co/cluster-name: elastic
    nodeSelectors:
      topology.kubernetes.io/zone: ${ZONE}
  target:
    mode: all
    selector:
      namespaces:
        - elastic
  loss:
    loss: "30"
    correlation: "0"
