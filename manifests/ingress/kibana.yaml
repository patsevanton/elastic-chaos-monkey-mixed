apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: kibana-auth
  namespace: elastic
spec:
  basicAuth:
    secret: kibana-basic-auth
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana
  namespace: elastic
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: elastic-kibana-auth@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: kibana.INGRESS_IP.sslip.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: chaos-kb-http
                port:
                  number: 5601
